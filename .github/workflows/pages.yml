name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  # 兜底重建：refresh.yml 用 GITHUB_TOKEN 提交时不会触发本工作流（GitHub 会抑制
  # GITHUB_TOKEN 产生的事件），因此每天在新闻抓取之后排两次重建 ——
  # UTC 01:45 / 13:45 = 北京时间 09:45 / 21:45（抓取任务 UTC 01:00 / 13:00 启动）。
  schedule:
    - cron: '45 1,13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the site from content source
        run: |
          python tools/build.py --check
          python tools/build.py

      - name: Verify built site
        run: |
          python tools/check_links.py --root site --quiet

      - name: Assemble publishable site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r site/. _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
